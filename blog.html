<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes | Kaagaaz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

    <script>
        if (localStorage.getItem("theme") !== "light") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">

            <a href="index.html" class="brand">
                kaagaaz.
            </a>

            <nav class="main-nav">
                <a href="index.html">about</a>
                <a href="projects.html">projects</a>
                <a href="blog.html" class="active">notes</a>
            </nav>

            <button
                id="theme-toggle"
                class="icon-button"
                type="button"
                aria-label="Toggle theme"
            >
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>
    </header>


    <!-- Main -->
    <main class="feed-wrap">

        <!-- Notes Header -->
        <section class="feed-section" id="blog-header-area">

            <div class="page-label">
                / notes
            </div>

            <h1 class="page-title">
                Things I've learned.
            </h1>

            <p class="page-description">
                Research notes, technical write-ups, experiments,
                discoveries, and things I find interesting.
            </p>

        </section>


        <!-- Blog List -->
        <section
            id="blog-list-container"
            class="blog-list"
        >
            <div class="loading-state">
                Loading notes...
            </div>
        </section>


        <!-- Single Blog Post -->
        <article
            id="blog-detail"
            class="single-view"
            hidden
        ></article>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="footer-inner">

            <span>
                © 2026 Kaagaaz
            </span>

            <span>
                built with curiosity.
            </span>

        </div>

    </footer>


    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Main Script -->
    <script src="script.js"></script>

</body>
</html>
