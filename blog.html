<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Kaagaaz</title>
    <meta name="description" content="Thoughts, notes, and writings by Kaagaaz.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<script>
if(localStorage.getItem("theme") !== "light"){
    document.body.classList.add("dark-mode");
}
</script>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="brand-logo">Kaagaaz</a>

        <nav class="nav-links">
            <a href="index.html" class="nav-item">About</a>
            <a href="projects.html" class="nav-item">Projects</a>
            <a href="blog.html" class="nav-item active">Blog</a>
        </nav>

        <div class="nav-actions">
            <button id="music-toggle" class="icon-btn" aria-label="Toggle music" title="Toggle Music">
                <i class="fa-solid fa-headphones"></i>
            </button>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>
</header>

<main class="container">
    <section class="about-hero">
        <div class="hero-header">
            <span class="greeting">Stream of Consciousness</span>
            <h1 class="name">Blog</h1>
        </div>

        <p class="bio-paragraph">
            Notes on tech, cybersecurity learnings, anime, and late-night thoughts.
        </p>

        <!-- Dynamic Container where GitHub Issues labeled 'blog' get rendered -->
        <div class="blog-list">
            <p class="bio-paragraph">Loading blog posts...</p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>© 2026 Kaagaaz · blogs &amp; projects stream live</p>
</footer>

<script src="script.js?v=4"></script>

</body>
</html>
