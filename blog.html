<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Kaagaaz</title>
    <meta name="description" content="Kaagaaz's blog — projects, thoughts, and lo-fi updates, streamed from GitHub issues.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="blog-page">

<!-- Prevent Theme Flicker -->
<script>
if (localStorage.getItem("theme") !== "light") {
    document.body.classList.add("dark-mode");
}
</script>

<header class="navbar">
    <div class="nav-container">
        

        <nav class="nav-links">
            <a href="index.html" class="nav-item">About</a>
            <a href="projects.html" class="nav-item">Projects</a>
            <a href="blog.html" class="nav-item active">Blog</a>
        </nav>

        <div class="nav-actions">
            <button id="music-toggle" class="icon-btn" aria-label="Toggle music" title="Toggle Music">
                <i class="fa-solid fa-headphones"></i>
            </button>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>
</header>

<main class="container">
    <section id="blog" class="about-hero feed-section blog-section">
        <header class="hero-header" id="blog-header-area">
            <span class="greeting">[ LOG_ARCHIVE ]</span>
            <h1 class="name">My blogs</h1>
            <p class="bio-paragraph">Sharing my projects, thoughts, and lo-fi updates.</p>
        </header>

        <!-- Blog Feed List -->
        <section id="blog-posts-container" class="blog-list">
            <p class="feed-message">Booting up the logs...</p>
        </section>

        <!-- Detailed Single View -->
        <article id="blog-detail" class="single-view" hidden></article>
    </section>
</main>

<footer class="site-footer">
    <p>© 2026 Kaagaaz · blogs &amp; projects stream live</p>
</footer>

<!-- JavaScript -->
<script src="script.js?v=6"></script>

</body>
</html>
