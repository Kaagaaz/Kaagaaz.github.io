<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog | Kaagaaz</title>

    <meta name="description" content="Kaagaaz's blog — projects, thoughts, and lo-fi updates, streamed from GitHub issues.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Markdown parser (blogs stream from GitHub issues) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=3">

</head>


<body class="blog-page">

<!-- Prevent theme flicker -->
<script>

if(localStorage.getItem("theme") !== "light"){
    document.body.classList.add("dark-mode");
}

</script>


<header class="navbar">

    <!-- Navigation -->

    <nav class="nav-links-group nav-full">

        <a href="index.html" class="nav-item">
            ABOUT ME
        </a>

        <a href="projects.html" class="nav-item">
            PROJECTS
        </a>

        <a href="blog.html" class="nav-item active">
            BLOG
        </a>

        <!-- Theme Button -->

        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">

            <i class="fa-solid fa-moon"></i>

        </button>

    </nav>

</header>


<main class="feed-wrap">


    <!-- ==========================
         BLOG SECTION
         ========================== -->

    <section id="blog" class="feed-section blog-section">

        <header class="section-head" id="blog-header-area">

            <p class="section-kicker">[ LOG_ARCHIVE ]</p>

            <h2 class="section-title">My blogs</h2>

            <p class="section-sub">Sharing my projects, thoughts, and lo-fi updates.</p>

        </header>

        <section id="blog-posts-container" class="blog-list">

            <p class="feed-message">Booting up the logs...</p>

        </section>

        <article id="blog-detail" class="single-view" hidden></article>

    </section>


</main>


<footer class="site-footer">

    <p>
        © 2026 Kaagaaz · blogs stream live from
        <a href="https://github.com/Kaagaaz/Kaagaaz.github.io/issues"
           target="_blank"
           rel="noopener noreferrer">GitHub issues</a>
    </p>

</footer>


<!-- JavaScript -->
<script src="script.js?v=3"></script>


</body>

</html>
