<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects | Kaagaaz</title>

    <!-- Your original global CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Project page font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Projects-only CSS -->
    <link rel="stylesheet" href="projects.css">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>


<body class="projects-layout">

    <!-- Prevent dark-mode flicker -->
    <script>
        if (localStorage.getItem("theme") !== "light") {
            document.body.classList.add("dark-mode");
        }
    </script>


    <!-- ==============================
         THEME BUTTON
         ============================== -->

    <button
        id="theme-toggle"
        class="theme-btn"
        aria-label="Toggle Theme"
    >
        <i class="fas fa-moon"></i>
    </button>


    <!-- ==============================
         MAIN PROJECT PAGE
         ============================== -->

    <main class="projects-page">

        <div class="projects-container" id="main-wrapper">


            <!-- ==============================
                 NAVIGATION
                 ============================== -->

            <div id="project-nav" class="project-nav">

                <a href="index.html" class="project-back-btn">

                    <i class="fas fa-arrow-left"></i>

                    <span>back home</span>

                </a>

            </div>


            <!-- ==============================
                 HEADER
                 ============================== -->

            <header
                class="projects-header"
                id="project-header-area"
            >

                <h1>My Creations</h1>

                <p>
                    Apps, tools, and tech concepts I build.
                </p>

            </header>


            <!-- ==============================
                 PROJECT GRID
                 ============================== -->

            <section
                id="projects-grid-container"
                class="projects-grid"
            >

                <p class="projects-message">

                    Loading the project boards...

                </p>

            </section>


        </div>

    </main>


    <!-- ==============================
         PROJECT JAVASCRIPT
         ============================== -->

    <script>

        const GITHUB_USERNAME = "Kaagaaz";
        const REPO_NAME = "Kaagaaz.github.io";


        /*
         * Check whether a single project
         * has been requested.
         *
         * Example:
         * projects.html?project=4
         */

        const urlParams =
            new URLSearchParams(window.location.search);

        const currentProjectId =
            urlParams.get("project");


        /*
         * ==============================
         * INITIALIZE
         * ==============================
         */

        async function initProjects() {

            if (currentProjectId) {

                await loadSingleProject(currentProjectId);

            } else {

                await loadProjectsList();

            }

        }


        /*
         * ==============================
         * CREATE PROJECT SNIPPET
         * ==============================
         */

        function createSnippet(markdownText) {

            if (!markdownText) {
                return "No description available.";
            }


            let cleanText = markdownText

                // Remove HTML comments
                .replace(
                    /<!--[\s\S]*?-->/g,
                    ""
                )

                // Remove HTML tags
                .replace(
                    /<[^>]*>/g,
                    ""
                )

                // Remove images
                .replace(
                    /!\[.*?\]\(.*?\)/g,
                    ""
                )

                // Remove links
                .replace(
                    /\[.*?\]\(.*?\)/g,
                    ""
                )

                // Remove code blocks
                .replace(
                    /`{3}[\s\S]*?`{3}/g,
                    ""
                )

                // Remove inline code
                .replace(
                    /`.*?`/g,
                    ""
                )

                // Remove markdown symbols
                .replace(
                    /[#*_-]/g,
                    ""
                )

                .trim();


            if (cleanText.length > 120) {

                return cleanText.substring(0, 120) + "...";

            }


            return (
                cleanText ||
                "View project details for comprehensive documentation."
            );

        }


        /*
         * ==============================
         * LOAD PROJECT LIST
         * ==============================
         */

        async function loadProjectsList() {

            const container =
                document.getElementById(
                    "projects-grid-container"
                );


            const url =
                `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/issues?labels=project&state=open`;


            try {

                const response = await fetch(url);


                if (!response.ok) {
                    throw new Error("Could not load projects");
                }


                const issues = await response.json();


                /*
                 * No projects
                 */

                if (issues.length === 0) {

                    container.className =
                        "projects-empty";

                    container.innerHTML = `

                        <p class="projects-message">

                            No projects showcased yet.
                            Check back soon!

                        </p>

                    `;

                    return;

                }


                /*
                 * Clear loading message
                 */

                container.innerHTML = "";


                /*
                 * Create cards
                 */

                issues.forEach(issue => {

                    const projectCard =
                        document.createElement("article");


                    projectCard.className =
                        "project-card";


                    const snippet =
                        createSnippet(issue.body);


                    projectCard.innerHTML = `

                        <div class="project-card-inner">


                            <!-- Technical top bar -->

                            <div class="project-card-top">

                                <span>
                                    [ SYSTEM_FILE:
                                    PROJ_${issue.number} ]
                                </span>

                                <span class="gacha-stars">
                                    ✦ ✦ ✦ ✦ ✦
                                </span>

                            </div>


                            <!-- Project information -->

                            <div class="project-card-content">

                                <h2>
                                    ${escapeHTML(issue.title)}
                                </h2>

                                <p class="project-card-body">
                                    ${escapeHTML(snippet)}
                                </p>

                            </div>


                            <!-- View button -->

                            <a
                                href="?project=${issue.number}"
                                class="project-view-btn"
                            >
                                View →
                            </a>


                        </div>

                    `;


                    container.appendChild(projectCard);

                });


            } catch (error) {

                console.error(error);


                container.className =
                    "projects-empty";


                container.innerHTML = `

                    <p class="projects-message">

                        Oops! Failed to connect
                        to the creations grid.

                    </p>

                `;

            }

        }


        /*
         * ==============================
         * LOAD SINGLE PROJECT
         * ==============================
         */

        async function loadSingleProject(id) {

            const container =
                document.getElementById(
                    "projects-grid-container"
                );


            const nav =
                document.getElementById(
                    "project-nav"
                );


            const header =
                document.getElementById(
                    "project-header-area"
                );


            const wrapper =
                document.getElementById(
                    "main-wrapper"
                );


            /*
             * Switch page into
             * single-project mode
             */

            container.className =
                "single-project-container";


            wrapper.classList.add(
                "single-project-mode"
            );


            /*
             * Change navigation
             */

            nav.innerHTML = `

                <a
                    href="projects.html"
                    class="project-back-btn"
                >

                    <i class="fas fa-arrow-left"></i>

                    <span>back to all projects</span>

                </a>

            `;


            /*
             * Hide header
             */

            header.style.display = "none";


            /*
             * GitHub API
             */

            const url =
                `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/issues/${id}`;


            try {

                const response =
                    await fetch(url);


                if (!response.ok) {
                    throw new Error("Project not found");
                }


                const issue =
                    await response.json();


                /*
                 * Parse Markdown
                 */

                const parsedContent =
                    marked.parse(
                        issue.body ||
                        "No documentation supplied."
                    );


                /*
                 * Render project
                 */

                container.innerHTML = `

                    <article class="full-project">

                        <h1 class="full-project-title">

                            ${escapeHTML(issue.title)}

                        </h1>


                        <div class="full-project-body">

                            ${parsedContent}

                        </div>

                    </article>

                `;


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="projects-empty">

                        <p class="projects-message">

                            Oops! This project detail
                            could not be loaded.

                        </p>


                        <a
                            href="projects.html"
                            class="project-view-btn"
                        >

                            Return to projects

                        </a>

                    </div>

                `;

            }

        }


        /*
         * ==============================
         * ESCAPE HTML
         * ==============================
         *
         * Prevents GitHub issue titles
         * from accidentally becoming HTML.
         */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;

        }


        /*
         * START
         */

        initProjects();

    </script>


    <!-- Your existing global JavaScript -->
    <script src="script.js"></script>

</body>

</html>
