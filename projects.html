<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Projects — Kaagaaz</title>

    <!-- JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Prevent theme flash -->
    <script>
        if (localStorage.getItem("theme") !== "light") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
</head>

<body>

    <!-- ================================================
         HEADER
         ================================================ -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="brand"
            >
                kaagaaz<span>.</span>
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    about
                </a>

                <a
                    href="projects.html"
                    class="active"
                >
                    projects
                </a>

                <a href="blog.html">
                    notes
                </a>

            </nav>


            <div class="header-actions">

                <button
                    id="theme-toggle"
                    class="icon-button"
                    type="button"
                    aria-label="Toggle theme"
                >
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </div>

    </header>


    <!-- ================================================
         MAIN
         ================================================ -->

    <main>

        <div class="feed-wrap">


            <!-- =========================================
                 PAGE INTRO
                 ========================================= -->

            <section
                class="feed-section"
                id="projects-header-area"
            >

                <div class="page-label">
                    / projects
                </div>


                <h1 class="page-title">
                    Things I've built.
                </h1>


                <p class="page-description">
                    Software, experiments, security projects,
                    and other things I've built while learning
                    and exploring technology.
                </p>

            </section>


            <!-- =========================================
                 PROJECT LIST
                 ========================================= -->

            <section
                id="projects-grid-container"
                class="projects-grid"
                aria-label="Projects"
            >

                <div class="loading-state">
                    Loading projects...
                </div>

            </section>


            <!-- =========================================
                 SINGLE PROJECT
                 ========================================= -->

            <article
                id="project-detail"
                class="single-view"
                hidden
            ></article>


        </div>

    </main>


    <!-- ================================================
         FOOTER
         ================================================ -->

    <footer class="site-footer">

        <div class="footer-inner">

            <span>
                © 2026 Kaagaaz
            </span>

            <span>
                built with curiosity.
            </span>

        </div>

    </footer>


    <!-- ================================================
         SCRIPTS
         ================================================ -->

    <!-- Markdown renderer -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>

    <!-- Main script -->
    <script src="script.js"></script>

</body>
</html>
